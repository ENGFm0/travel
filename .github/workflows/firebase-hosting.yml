name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/travel-expense-splitter-nl6smz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Build web app (served at the domain root)
        # Base is '/' here (served from bordingpass-ae272.web.app root), so
        # Google sign-in is same-origin with the Firebase auth handler and works
        # on Safari + installed PWA. Firebase web config is public by design.
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDHgRo-dppxAMa_1JvVrI1Twfu8e1JV4I0
          # authDomain matches the hosting domain we serve from (web.app) so the
          # OAuth handler is same-origin with the app — this is what fixes Google
          # sign-in on Safari and inside the installed PWA.
          VITE_FIREBASE_AUTH_DOMAIN: bordingpass-ae272.web.app
          VITE_FIREBASE_PROJECT_ID: bordingpass-ae272
          VITE_FIREBASE_STORAGE_BUCKET: bordingpass-ae272.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "380577603179"
          VITE_FIREBASE_APP_ID: "1:380577603179:web:4f1e2e0c35c9f857e41b2e"
        run: npm --workspace apps/web run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: bordingpass-ae272
          channelId: live
          entryPoint: ./firebase
