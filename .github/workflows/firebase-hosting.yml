name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/travel-expense-splitter-nl6smz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Build web app (served at the domain root)
        # Base is '/' here (served from bordingpass-ae272.web.app root), so
        # Google sign-in is same-origin with the Firebase auth handler and works
        # on Safari + installed PWA. Firebase web config is public by design.
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDHgRo-dppxAMa_1JvVrI1Twfu8e1JV4I0
          # Use the firebaseapp.com auth domain: it is the OAuth handler URI that
          # Google's client already has registered (web.app is not, which caused
          # redirect_uri_mismatch). With signInWithPopup the handler opens as a
          # first-party window and posts the result back to the app, so this works
          # even though the app itself is served from web.app.
          VITE_FIREBASE_AUTH_DOMAIN: bordingpass-ae272.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: bordingpass-ae272
          VITE_FIREBASE_STORAGE_BUCKET: bordingpass-ae272.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "380577603179"
          VITE_FIREBASE_APP_ID: "1:380577603179:web:4f1e2e0c35c9f857e41b2e"
          # Google Maps JS key — public by design, restricted to the web.app
          # referrer in the Cloud console. Powers in-app place search.
          VITE_GOOGLE_MAPS_KEY: AIzaSyBaJPU21zfuupnhP6HLIApc7fhb_UkbnPs
        run: npm --workspace apps/web run build

      - name: Write service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty or not visible to this run."
            exit 1
          fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase Hosting (live)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only hosting --project bordingpass-ae272 --non-interactive

      - name: Deploy Firestore security rules (best-effort)
        # Needs the service account to have the "Service Usage Consumer" role;
        # if it doesn't, this is skipped without failing the hosting deploy.
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project bordingpass-ae272 --non-interactive
