name: CI (monorepo)

on:
  push:
    branches: [claude/travel-expense-splitter-nl6smz, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'

jobs:
  web:
    name: Web — typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest — shell, i18n, a11y, routing, contrast, error contract)
        run: npm test

      - name: Build
        run: npm run build
