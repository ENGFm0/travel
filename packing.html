<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تجهيز الحقيبة - بوردنق</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/theme.js?v=10"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/responsive.css?v=10"/>
<style>
  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400}
  html.dark body{background:#14213D;color:#FDF6EC}
  html.dark .card{background:#1F2F54;border-color:#2A3F6C}
  html.dark .muted{color:rgba(253,246,236,.7)}
  .pk.done .p-label{text-decoration:line-through;opacity:.5}
</style>
</head>
<body class="bg-brand-surface text-brand-navy">
<main class="max-w-[900px] mx-auto px-5 py-8 flex flex-col gap-6">

  <section class="flex flex-col gap-2">
    <a href="planner.html" class="text-sm text-brand-navy/60 inline-flex items-center gap-1"><span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>خطط لرحلتك</a>
    <h1 class="text-3xl font-bold">تجهيز الحقيبة</h1>
    <p class="muted text-brand-navy/70">أضف أغراضك أو ابدأ بقالب جاهز بنقرة واحدة. علّم كل غرض عند تجهيزه.</p>
  </section>

  <!-- Templates -->
  <div class="card bg-white rounded-2xl shadow-card border border-surface-variant p-4 flex flex-col gap-3">
    <div class="font-bold">قوالب جاهزة بنقرة واحدة</div>
    <div class="flex flex-wrap gap-2">
      <button class="tpl px-4 h-10 rounded-full bg-brand-teal/15 text-brand-teal font-semibold text-sm inline-flex items-center gap-1" data-tpl="beach"><span class="material-symbols-outlined" style="font-size:18px">beach_access</span>رحلة بحر</button>
      <button class="tpl px-4 h-10 rounded-full bg-brand-blue/15 text-brand-blue font-semibold text-sm inline-flex items-center gap-1" data-tpl="cold"><span class="material-symbols-outlined" style="font-size:18px">ac_unit</span>وجهة باردة</button>
      <button class="tpl px-4 h-10 rounded-full bg-brand-gold/20 text-brand-gold font-semibold text-sm inline-flex items-center gap-1" data-tpl="biz"><span class="material-symbols-outlined" style="font-size:18px">work</span>سفر عمل</button>
      <button class="tpl px-4 h-10 rounded-full bg-brand-violet/15 text-brand-violet font-semibold text-sm inline-flex items-center gap-1" data-tpl="essentials"><span class="material-symbols-outlined" style="font-size:18px">stars</span>الأساسيات</button>
    </div>
  </div>

  <!-- Add item -->
  <div class="flex gap-2">
    <input id="new-item" type="text" placeholder="أضف غرضاً..." class="flex-1 h-11 rounded-lg border border-surface-variant px-3 bg-white card"/>
    <button id="add-btn" class="bn-cta"><span class="material-symbols-outlined">add</span></button>
  </div>

  <div class="card bg-white rounded-2xl shadow-card border border-surface-variant p-2">
    <div class="flex items-center justify-between px-3 py-2">
      <span id="pk-count" class="text-sm muted text-brand-navy/60">0 غرض</span>
      <button id="clear-done" class="text-sm text-brand-orange font-semibold">حذف المُجهّز</button>
    </div>
    <div id="pk-list" class="flex flex-col"></div>
    <p id="pk-empty" class="text-center muted text-brand-navy/50 py-8">لا أغراض بعد — ابدأ بقالب جاهز أو أضف غرضاً.</p>
  </div>
</main>

<script>
  var TPL={
    beach:['نظارة شمسية','واقي شمس','ملابس سباحة','شبشب','قبعة','منشفة'],
    cold:['جاكيت شتوي','قفازات','طاقية صوف','سكارف','جوارب حرارية','حذاء مقاوم'],
    biz:['بدلة رسمية','لابتوب + شاحن','بطاقات عمل','قميص إضافي','ربطة عنق'],
    essentials:['جواز السفر','الشاحن + الباوربانك','أدوية شخصية','فرشاة ومعجون','محفظة وبطاقات','سماعات']
  };
  var KEY='boarding.packing.v1';
  var items=[]; try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
  var list=document.getElementById('pk-list');

  function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
  function render(){
    list.innerHTML='';
    document.getElementById('pk-empty').style.display=items.length?'none':'block';
    var done=0;
    items.forEach(function(it,i){
      if(it.done)done++;
      var row=document.createElement('label');
      row.className='pk '+(it.done?'done':'')+' flex items-center gap-3 px-3 py-3 rounded-xl cursor-pointer hover:bg-brand-surface/60';
      row.innerHTML='<input type="checkbox" class="w-5 h-5 accent-[#E85D3D]" '+(it.done?'checked':'')+'/>'+
        '<span class="p-label flex-1">'+it.t+'</span>'+
        '<button data-del="'+i+'" class="text-brand-navy/40 hover:text-error"><span class="material-symbols-outlined" style="font-size:20px">delete</span></button>';
      row.querySelector('input').addEventListener('change',function(e){items[i].done=e.target.checked;save();render();});
      row.querySelector('[data-del]').addEventListener('click',function(e){e.preventDefault();items.splice(i,1);save();render();});
      list.appendChild(row);
    });
    document.getElementById('pk-count').textContent=items.length+' غرض · '+done+' مُجهّز';
  }
  function addItems(arr){
    arr.forEach(function(t){ if(!items.some(function(x){return x.t===t})) items.push({t:t,done:false}); });
    save();render();
  }
  document.querySelectorAll('.tpl').forEach(function(b){b.addEventListener('click',function(){addItems(TPL[b.dataset.tpl]);});});
  document.getElementById('add-btn').addEventListener('click',function(){
    var v=document.getElementById('new-item').value.trim(); if(!v)return;
    addItems([v]); document.getElementById('new-item').value='';
  });
  document.getElementById('new-item').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('add-btn').click();});
  document.getElementById('clear-done').addEventListener('click',function(){items=items.filter(function(x){return !x.done});save();render();});
  render();
</script>
<script src="assets/responsive.js?v=10" defer></script>
</body></html>
