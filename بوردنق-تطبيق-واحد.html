<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بوردنق — مصاريف السفر والقطّات</title>
<meta name="theme-color" content="#0e4d54">
<style>
/* =========================================================
   بوردنق — Design System
   نظيف، بأسلوب سفر حقيقي. لا تدرّجات "ذكاء اصطناعي" ولا أيقونات غريبة.
   ========================================================= */

:root {
  /* Palette — sea teal + warm sand + ink */
  --teal-900: #0a3b41;
  --teal-800: #0e4d54;
  --teal-700: #12626b;
  --teal-100: #d9ecee;
  --teal-050: #eef7f8;

  --sand-600: #c8873f;
  --sand-500: #e0a24a;
  --sand-100: #f8ecd8;

  --ink-900: #14201f;
  --ink-700: #33413f;
  --ink-500: #5c6a68;
  --ink-300: #97a3a1;

  --paper: #ffffff;
  --bg: #f4f6f5;
  --line: #e3e8e7;

  --green: #2f8f5b;
  --green-bg: #e5f3ea;
  --red: #c0453b;
  --red-bg: #f7e6e4;

  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(20, 32, 31, .06);
  --shadow: 0 6px 20px rgba(20, 32, 31, .08);
  --shadow-lg: 0 18px 48px rgba(20, 32, 31, .16);

  --maxw: 760px;
  --font: 'Tajawal', 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink-900);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}

.container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding-inline: 18px; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 1rem; }
a { color: var(--teal-700); }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: var(--teal-800);
  color: #fff;
  box-shadow: var(--shadow-sm);
  padding-top: env(safe-area-inset-top);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; color: #fff; font-weight: 800; font-size: 1.25rem; }
.brand-mark {
  display: grid; place-items: center; width: 34px; height: 34px;
  background: rgba(255,255,255,.14); border-radius: 10px; color: var(--sand-500);
}
.header-actions { display: flex; align-items: center; gap: 8px; }

/* ---------- Main ---------- */
.app-main { padding-block: 20px 90px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: .98rem;
  transition: transform .05s ease, background .15s ease, box-shadow .15s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--teal-800); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--teal-700); }
.btn-sand { background: var(--sand-500); color: #4a2f0e; }
.btn-sand:hover { background: var(--sand-600); color: #fff; }
.btn-ghost { background: var(--paper); color: var(--ink-700); box-shadow: inset 0 0 0 1px var(--line); }
.btn-ghost:hover { background: var(--teal-050); }
.btn-danger-ghost { background: var(--red-bg); color: var(--red); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: .88rem; border-radius: 10px; }
.btn-icon { padding: 9px; width: 40px; height: 40px; border-radius: 11px; }
.header-actions .btn-ghost { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; }
.header-actions .btn-ghost:hover { background: rgba(255,255,255,.22); }
.header-actions .btn-icon.synced { background: rgba(120,220,160,.28); color: #bff0d0; }

/* ---------- Cards ---------- */
.card {
  background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow-sm);
  border: 1px solid var(--line);
}
.card-pad { padding: 18px; }

/* ---------- Page headings ---------- */
.page-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
.page-sub { color: var(--ink-500); margin-bottom: 20px; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px; }
.section-head h2 { font-size: 1.18rem; font-weight: 800; }
.section-head .hint { color: var(--ink-300); font-size: .85rem; }

/* ---------- Empty state ---------- */
.empty {
  text-align: center; padding: 46px 22px; color: var(--ink-500);
  border: 2px dashed var(--line); border-radius: var(--radius); background: var(--paper);
}
.empty svg { width: 44px; height: 44px; color: var(--ink-300); margin-bottom: 12px; }
.empty h3 { color: var(--ink-700); font-size: 1.1rem; margin-bottom: 6px; }

/* ---------- Trip cards (home) ---------- */
.trip-grid { display: grid; gap: 14px; }
.trip-card {
  display: block; text-align: start; width: 100%;
  background: var(--paper); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-sm); border: 1px solid var(--line);
  transition: transform .08s ease, box-shadow .15s ease;
}
.trip-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.trip-cover {
  height: 96px; background: linear-gradient(120deg, var(--teal-800), var(--teal-700));
  position: relative; display: flex; align-items: flex-end; padding: 12px 16px; color: #fff;
}
.trip-cover .flag { font-size: 2.4rem; position: absolute; top: 12px; inset-inline-end: 16px; }
.cloud-tag { position: absolute; top: 14px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; background: rgba(255,255,255,.2); color: #fff; padding: 3px 9px; border-radius: 999px; }
.cloud-tag svg { width: 13px; height: 13px; }
.trip-cover .dest { font-weight: 800; font-size: 1.2rem; }
.trip-card-body { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.trip-meta { display: flex; gap: 16px; color: var(--ink-500); font-size: .9rem; flex-wrap: wrap; }
.trip-meta b { color: var(--ink-900); font-weight: 700; }

/* ---------- Tabs ---------- */
.tabs {
  display: flex; gap: 4px; background: var(--paper); padding: 5px; border-radius: 14px;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm); overflow-x: auto;
  position: sticky; top: 68px; z-index: 30; margin-bottom: 20px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 12px; border-radius: 10px; font-weight: 700; font-size: .92rem; color: var(--ink-500);
  white-space: nowrap;
}
.tab svg { width: 17px; height: 17px; }
.tab.active { background: var(--teal-050); color: var(--teal-800); }

/* ---------- Chips / badges ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
  font-size: .82rem; font-weight: 700; background: var(--teal-050); color: var(--teal-800);
}
.chip.amir { background: var(--sand-100); color: var(--sand-600); }
.chip.muted { background: #eef1f0; color: var(--ink-500); }
.badge { font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.badge.group { background: var(--teal-050); color: var(--teal-800); }
.badge.some { background: var(--sand-100); color: var(--sand-600); }
.badge.personal { background: #eef1f0; color: var(--ink-500); }

/* ---------- Members ---------- */
.member-row { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.member-row:last-child { border-bottom: none; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; color: #fff; flex-shrink: 0; font-size: 1rem;
}
.member-name { font-weight: 700; }
.member-grow { flex: 1; }

/* ---------- Stages / progress ---------- */
.stages { display: grid; gap: 10px; }
.stage {
  display: flex; align-items: center; gap: 13px; padding: 13px 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
}
.stage-dot {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  background: #eef1f0; color: var(--ink-300); font-weight: 800;
}
.stage.done .stage-dot { background: var(--green); color: #fff; }
.stage.active { border-color: var(--teal-700); box-shadow: 0 0 0 3px var(--teal-050); }
.stage.active .stage-dot { background: var(--teal-800); color: #fff; }
.stage-body { flex: 1; }
.stage-title { font-weight: 700; }
.stage-note { font-size: .85rem; color: var(--ink-500); }
.stage-check { width: 24px; height: 24px; color: var(--green); }

/* ---------- Place cards ---------- */
.place {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px;
}
.place-idx {
  width: 28px; height: 28px; border-radius: 8px; background: var(--teal-050); color: var(--teal-800);
  display: grid; place-items: center; font-weight: 800; flex-shrink: 0; font-size: .9rem;
}
.place-body { flex: 1; min-width: 0; }
.place-name { font-weight: 700; }
.place-note { font-size: .88rem; color: var(--ink-500); margin-top: 2px; }
.place-links { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.map-link {
  display: inline-flex; align-items: center; gap: 5px; font-size: .84rem; font-weight: 700;
  color: var(--teal-700); background: var(--teal-050); padding: 5px 10px; border-radius: 9px;
}
.map-link svg { width: 14px; height: 14px; }

/* ---------- Expense rows ---------- */
.exp {
  display: flex; align-items: center; gap: 12px; padding: 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px;
}
.exp-cat {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0;
  background: var(--teal-050); color: var(--teal-800);
}
.exp-cat svg { width: 21px; height: 21px; }
.exp-body { flex: 1; min-width: 0; }
.exp-title { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.exp-sub { font-size: .84rem; color: var(--ink-500); margin-top: 2px; }
.exp-amount { font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.exp-amount small { font-weight: 700; font-size: .72rem; color: var(--ink-300); }

/* ---------- Summary tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: center; }
.tile .v { font-size: 1.35rem; font-weight: 800; color: var(--teal-800); }
.tile .l { font-size: .78rem; color: var(--ink-500); margin-top: 2px; }
@media (max-width: 460px) { .tile .v { font-size: 1.1rem; } }

/* ---------- Settlement ---------- */
.settle {
  display: flex; align-items: center; gap: 12px; padding: 15px 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px;
}
.settle-flow { flex: 1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.settle-arrow { color: var(--ink-300); }
.settle-arrow svg { width: 20px; height: 20px; }
.settle-amount { font-weight: 800; color: var(--teal-800); }
.who { display: flex; align-items: center; gap: 7px; font-weight: 700; }

.balance-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.balance-row:last-child { border-bottom: none; }
.balance-val { font-weight: 800; }
.balance-val.pos { color: var(--green); }
.balance-val.neg { color: var(--red); }

/* ---------- Forms / modal ---------- */
.modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
.modal-root.open { display: block; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(10, 32, 31, .5); backdrop-filter: blur(2px); }
.modal {
  position: absolute; inset-inline: 0; bottom: 0; max-width: var(--maxw); margin: 0 auto;
  background: var(--paper); border-radius: 22px 22px 0 0; box-shadow: var(--shadow-lg);
  max-height: 92vh; display: flex; flex-direction: column;
  animation: sheet-up .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@media (min-width: 560px) {
  .modal { inset: 0; margin: auto; height: fit-content; max-height: 90vh; border-radius: 22px;
           animation: pop .2s ease; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px;
  position: relative;
}
.modal-head::before {
  content: ""; position: absolute; top: 8px; inset-inline: 0; margin: auto; width: 40px; height: 4px;
  background: var(--line); border-radius: 999px;
}
.modal-head h3 { font-size: 1.2rem; font-weight: 800; }
.modal-body { padding: 8px 20px 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }

.field { margin-bottom: 16px; }
.field > label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 7px; color: var(--ink-700); }
.field .hint { font-weight: 400; color: var(--ink-300); font-size: .82rem; }
.input, .select, textarea.input {
  width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--bg);
  border: 1.5px solid var(--line); color: var(--ink-900); transition: border-color .15s ease, background .15s;
}
.input:focus, .select:focus, textarea.input:focus {
  outline: none; border-color: var(--teal-700); background: #fff;
}
textarea.input { resize: vertical; min-height: 72px; }
.input-group { display: flex; gap: 8px; }
.input-group .input { flex: 1; }

.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg-opt {
  flex: 1 1 auto; padding: 12px 10px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--bg); text-align: center; font-weight: 700; font-size: .9rem; color: var(--ink-500);
  transition: all .12s ease;
}
.seg-opt small { display: block; font-weight: 400; font-size: .74rem; color: var(--ink-300); margin-top: 2px; }
.seg-opt.sel { border-color: var(--teal-700); background: var(--teal-050); color: var(--teal-800); }
.seg-opt.sel small { color: var(--teal-700); }

/* member picker chips */
.picker { display: flex; gap: 8px; flex-wrap: wrap; }
.pick {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--bg); font-weight: 700; font-size: .88rem; color: var(--ink-500);
}
.pick.sel { border-color: var(--teal-700); background: var(--teal-050); color: var(--teal-800); }
.pick .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .72rem; font-weight: 800; }

/* category grid */
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-opt {
  display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 4px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink-500);
  font-size: .74rem; font-weight: 700;
}
.cat-opt svg { width: 22px; height: 22px; }
.cat-opt.sel { border-color: var(--teal-700); background: var(--teal-050); color: var(--teal-800); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; inset-inline: 0; bottom: 24px; margin: auto; z-index: 200;
  width: fit-content; max-width: 90%; background: var(--ink-900); color: #fff;
  padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: .92rem;
  box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(20px); pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ---------- Misc ---------- */
.row-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-500); background: transparent;
}
.icon-btn:hover { background: var(--bg); color: var(--ink-900); }
.icon-btn.danger:hover { background: var(--red-bg); color: var(--red); }
.icon-btn svg { width: 18px; height: 18px; }

.divider { height: 1px; background: var(--line); margin: 20px 0; }
.muted-text { color: var(--ink-500); font-size: .9rem; }
.center { text-align: center; }
.mt { margin-top: 14px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: grid; gap: 0; }

.pay-note {
  background: var(--sand-100); color: var(--sand-600); padding: 12px 14px; border-radius: 12px;
  font-size: .88rem; font-weight: 500; display: flex; gap: 10px; align-items: flex-start; margin-top: 4px;
}
.pay-note svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

/* ---------- عملة مزدوجة ---------- */
.dual { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.25; }
.dual-h { font-weight: 800; }
.dual-d { font-size: .74rem; color: var(--ink-300); font-weight: 700; }

/* ---------- badges: سداد ---------- */
.badge.paid { background: var(--green-bg); color: var(--green); }
.badge.pending { background: var(--sand-100); color: var(--sand-600); }

/* ---------- من أنت ---------- */
.whoami { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.whoami > label { font-weight: 700; color: var(--ink-500); }
.select-wrap { position: relative; flex: 1; min-width: 140px; }
.select-wrap svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-500); pointer-events: none; }
.select-wrap .select { padding-inline-start: 34px; }
.select { width: 100%; padding: 11px 14px; border-radius: 12px; background: var(--paper); border: 1.5px solid var(--line); color: var(--ink-900); appearance: none; font-weight: 700; }

/* ---------- بطاقة الميزانية ---------- */
.budget-card { display: grid; gap: 2px; }
.bk-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 2px; border-bottom: 1px solid var(--line); gap: 10px; }
.bk-row span { color: var(--ink-700); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bk-row b { font-weight: 800; white-space: nowrap; }
.bk-row b.neg { color: var(--red); }
.bk-total { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 4px; }
.bk-total span:first-child { font-weight: 800; font-size: 1.05rem; }
.bk-amt .dual-h { font-size: 1.35rem; color: var(--teal-800); }
.bk-amt.over .dual-h { color: var(--red); }
.bk-note { margin-top: 10px; padding: 10px 12px; background: var(--teal-050); border-radius: 10px; font-size: .86rem; color: var(--teal-800); }

/* ---------- بطاقة القطة (الصندوق) ---------- */
.pool-hero { background: linear-gradient(140deg, var(--teal-800), var(--teal-700)); color: #fff; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.pool-hero-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.pool-hero-top .btn-ghost { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; }
.pool-label { font-size: .82rem; opacity: .8; }
.pool-share .dual-h { font-size: 1.6rem; font-weight: 800; }
.pool-share .dual-d { color: rgba(255,255,255,.7); }
.pool-share { display: flex; flex-direction: column; }
.pool-bar { height: 8px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
.pool-bar span { display: block; height: 100%; background: var(--sand-500); border-radius: 999px; transition: width .3s ease; }
.pool-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.pool-stats > div { background: rgba(255,255,255,.1); border-radius: 10px; padding: 8px 4px; }
.pool-stats b { display: block; font-size: .95rem; font-weight: 800; }
.pool-stats b.over { color: #ffcabf; }
.pool-stats small { font-size: .68rem; opacity: .75; }
.pool-covers { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: .84rem; background: rgba(255,255,255,.1); padding: 9px 11px; border-radius: 10px; }
.pool-covers svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
@media (max-width: 440px) { .pool-stats b { font-size: .82rem; } .pool-stats { gap: 6px; } }

/* ---------- صفوف حالة السداد ---------- */
.status-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.status-row:last-child { border-bottom: none; }
.status-row .badge { flex-shrink: 0; }

/* ---------- إدخال المبلغ + العملة ---------- */
.amount-row { display: flex; gap: 8px; align-items: stretch; }
.amount-row .input { flex: 1; }
.cur-seg { flex: 0 0 auto; }
.cur-seg .seg-opt { padding: 8px 12px; font-size: .82rem; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rate-row { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.rate-row b { color: var(--teal-800); }
.share-preview { background: var(--teal-050); color: var(--teal-800); padding: 12px 14px; border-radius: 12px; font-size: .9rem; min-height: 4px; }
.share-preview:empty { display: none; }
.conv-preview { color: var(--ink-500); font-size: .84rem; font-weight: 700; margin-top: 6px; min-height: 2px; }
.conv-preview:empty { display: none; }

/* قسم القطّات المشتركة تحت القطة */
.shared-block { margin-top: 30px; padding-top: 22px; border-top: 2px dashed var(--line); }
.shared-block .section-head:first-child { margin-top: 0; }
.input-group .btn { flex: 0 0 auto; }

/* ---------- بحث الأماكن الحي (Autocomplete) ---------- */
.ac-wrap { position: relative; }
.ac-icon { position: absolute; inset-inline-start: 12px; top: 13px; width: 18px; height: 18px; color: var(--ink-300); pointer-events: none; }
.ac-icon svg { width: 18px; height: 18px; }
.ac-input { padding-inline-start: 40px; }
.ac-list {
  position: absolute; inset-inline: 0; top: calc(100% + 6px); z-index: 20;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  overflow: hidden; display: none;
}
.ac-list.open { display: block; }
.ac-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover { background: var(--teal-050); }
.ac-pin { color: var(--teal-700); flex-shrink: 0; }
.ac-pin svg { width: 18px; height: 18px; }
.ac-txt { display: flex; flex-direction: column; min-width: 0; }
.ac-txt b { font-weight: 700; font-size: .92rem; }
.ac-txt small { color: var(--ink-500); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ac-flag { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }

/* صندوق سعر الصرف التلقائي */
.rate-box { background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.rate-box small { color: var(--green); font-weight: 700; background: var(--green-bg); padding: 2px 8px; border-radius: 999px; }
.rate-ok { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink-900); }
.rate-ok svg { width: 16px; height: 16px; color: var(--green); }
.rate-ok b { color: var(--teal-800); }

/* ---------- التقييم بالنجوم ---------- */
.stars { display: inline-flex; gap: 1px; vertical-align: middle; }
.star { width: var(--sz, 14px); height: var(--sz, 14px); color: var(--line); }
.star svg { width: 100%; height: 100%; }
.star.on { color: var(--sand-500); }
.star.on svg { fill: var(--sand-500); }
.rating-pill { display: inline-flex; align-items: center; gap: 3px; font-size: .78rem; font-weight: 800; color: var(--sand-600); background: var(--sand-100); padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
.rating-pill svg { width: 13px; height: 13px; fill: var(--sand-500); }
.rating-pill small { font-weight: 700; color: var(--ink-300); }

.star-pick { display: flex; gap: 6px; }
.star-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--line); display: grid; place-items: center; }
.star-btn svg { width: 24px; height: 24px; }
.star-btn.on { color: var(--sand-500); border-color: var(--sand-500); background: var(--sand-100); }
.star-btn.on svg { fill: var(--sand-500); }

/* ---------- تجارب الأعضاء ---------- */
.reviews { margin-top: 12px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.review { display: flex; align-items: flex-start; gap: 10px; }
.review-body { flex: 1; min-width: 0; }
.review-head { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.review-note { font-size: .86rem; color: var(--ink-700); margin-top: 3px; line-height: 1.5; }

</style>
</head>

/* =========================================================
   settle.js — حسابات القطة والميزانية والتسوية بين الأشخاص
   كل المبالغ بعملة الديار (home).
   ========================================================= */

const r2 = (n) => Math.round(n * 100) / 100;

/* ---------------- القطة (الصندوق) ---------------- */
function poolStats(trip) {
  const parts = trip.pool.participantIds.filter(id => trip.members.some(m => m.id === id));
  const count = parts.length;
  const total = trip.pool.total || 0;
  const share = count ? total / count : 0;

  const paidIds = parts.filter(id => trip.members.find(m => m.id === id)?.qattahPaid);
  const collected = r2(share * paidIds.length);
  const spent = r2(trip.groupExpenses.reduce((s, e) => s + e.amount, 0));
  const remaining = r2(collected - spent);

  return {
    participants: parts,
    count,
    total: r2(total),
    share: r2(share),
    paidIds,
    pendingIds: parts.filter(id => !paidIds.includes(id)),
    collected,
    spent,
    remaining,
    fundedPct: total ? Math.min(100, Math.round((collected / total) * 100)) : 0,
  };
}

/* ---------------- ميزانية عضو ---------------- */
function memberBudget(trip, memberId) {
  const m = trip.members.find(x => x.id === memberId);
  const budget = m && m.budget != null ? m.budget : null;
  const isParticipant = trip.pool.participantIds.includes(memberId);
  const ps = poolStats(trip);
  const qattahShare = isParticipant ? ps.share : 0;
  const personal = (trip.personalExpenses[memberId] || []);
  const personalSpent = r2(personal.reduce((s, e) => s + e.amount, 0));

  // صافي القطّات المشتركة لهذا العضو (+ له / - عليه)
  const shared = sharedNet(trip)[memberId] || 0;

  const remaining = budget == null ? null : r2(budget - qattahShare - personalSpent);
  return {
    budget, qattahShare, personalSpent, remaining,
    personalCount: personal.length,
    isParticipant,
    qattahPaid: !!m?.qattahPaid,
    sharedNet: r2(shared),
  };
}

/* ---------------- قطة مشتركة بين أشخاص ---------------- */
// تُقسّم بالتساوي على المشاركين؛ الدافع دفع الكل وكل مشارك عليه نصيبه
function sharedNet(trip) {
  const net = {};
  trip.members.forEach(m => { net[m.id] = 0; });
  trip.sharedExpenses.forEach(e => {
    const parts = (e.participants || []).filter(id => net[id] !== undefined);
    if (!parts.length) return;
    const share = e.amount / parts.length;
    if (net[e.paidBy] !== undefined) net[e.paidBy] += e.amount;   // دفع الكل
    parts.forEach(id => { net[id] -= share; });                  // كل مشارك عليه نصيبه
  });
  Object.keys(net).forEach(k => net[k] = r2(net[k]));
  return net;
}
function settleShared(trip) {
  const net = sharedNet(trip);
  const creditors = [], debtors = [];
  Object.entries(net).forEach(([id, v]) => {
    if (v > 0.009) creditors.push({ id, amt: v });
    else if (v < -0.009) debtors.push({ id, amt: -v });
  });
  creditors.sort((a, b) => b.amt - a.amt);
  debtors.sort((a, b) => b.amt - a.amt);
  const txns = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const d = debtors[i], c = creditors[j];
    const pay = r2(Math.min(d.amt, c.amt));
    if (pay > 0) txns.push({ from: d.id, to: c.id, amount: pay });
    d.amt = r2(d.amt - pay); c.amt = r2(c.amt - pay);
    if (d.amt <= 0.009) i++;
    if (c.amt <= 0.009) j++;
  }
  return txns;
}

function sbUrl() { try { return localStorage.getItem(URL_LS) || DEFAULT_URL; } catch { return DEFAULT_URL; } }

    const s = document.createElement('script');
    s.async = true;
    s.onerror = () => { _mapsPromise = null; reject(new Error('load-failed')); };
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places&language=ar&loading=async&callback=__boardingMapsReady`;
    document.head.appendChild(s);
  });
  return _mapsPromise;
}
const mapsSearchUrl = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const mapsPlaceUrl = (q, placeId) => placeId
  ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}&query_place_id=${encodeURIComponent(placeId)}`
  : mapsSearchUrl(q);

/* ---------------- سعر الصرف التلقائي ---------------- */
// 1 عملة الديار = rate عملة الوجهة
async function fetchRate(home, dest) {
  if (!home || !dest || home === dest) return 1;
  const res = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(home)}`, { cache: 'no-store' });
  const data = await res.json();
  const r = data?.rates?.[dest];
  if (!r) throw new Error('no-rate');
  return Math.round(r * 10000) / 10000;
}

/* ---------------- منتقي الدول (بحث) ---------------- */
function wireCountryPicker(input, list, onPick) {
  const render = () => {
    const q = input.value.trim();
    const ql = q.toLowerCase();
    const items = (q ? COUNTRIES.filter(([code, ar]) => ar.includes(q) || code.toLowerCase().includes(ql)) : COUNTRIES).slice(0, 8);
    if (!items.length) { list.innerHTML = ''; list.classList.remove('open'); return; }
    list.innerHTML = items.map(([code, ar, cur]) => `
      <button type="button" class="ac-item" data-code="${code}" data-ar="${esc(ar)}" data-cur="${cur}">
        <span class="ac-flag">${flagOf(code)}</span>
        <span class="ac-txt"><b>${esc(ar)}</b><small>${cur}</small></span></button>`).join('');
    list.classList.add('open');
    list.querySelectorAll('.ac-item').forEach(b => b.onclick = () => {
      input.value = b.dataset.ar; list.innerHTML = ''; list.classList.remove('open');
      onPick({ code: b.dataset.code, ar: b.dataset.ar, cur: b.dataset.cur });
    });
  };
  input.oninput = render;
  input.onfocus = render;
  input.onblur = () => setTimeout(() => list.classList.remove('open'), 180);
}

function stars(n, size) {
  const s = size || 14;
  let out = '<span class="stars" style="--sz:' + s + 'px">';
  for (let i = 1; i <= 5; i++) out += `<span class="star ${i <= n ? 'on' : ''}">${icons.star}</span>`;
  return out + '</span>';
}
function avgRating(p) {
  const rs = (p.reviews || []).filter(r => r.rating > 0);
  if (!rs.length) return 0;
  return Math.round((rs.reduce((s, r) => s + r.rating, 0) / rs.length) * 10) / 10;
}

/* =========================================================
   ربط الأحداث
   ========================================================= */
function wire(t, tab) {
  const c = $('#tc');
  const on = (sel, fn) => c.querySelectorAll(sel).forEach(el => el.onclick = fn);

  // مصاريفي
  const sel = c.querySelector('#whoami-sel');
  if (sel) sel.onchange = () => { db.setCurrentMember(t.id, sel.value); render(); };
  on('[data-act="set-budget"]', () => openSetBudget(t));
  on('[data-act="add-personal"]', () => openExpense(t, 'personal'));
  on('[data-del-personal]', e => { db.removePersonalExpense(t.id, t.currentMemberId, e.currentTarget.dataset.delPersonal); render(); });
  on('[data-act="go-pool"]', () => go(t.id, 'pool'));

  // القطة / الأعضاء
  on('[data-act="add-member"]', () => openMember(t));
  on('[data-edit-member]', e => openMember(t, e.currentTarget.dataset.editMember));
  on('[data-del-member]', e => { try { db.removeMember(t.id, e.currentTarget.dataset.delMember); render(); } catch (err) { toast(err.message); } });
  on('[data-make-amir]', e => { db.setAmir(t.id, e.currentTarget.dataset.makeAmir); toast('تم تعيين أمير الرحلة'); render(); });
  on('[data-act="setup-pool"]', () => openPool(t));
  on('[data-toggle-paid]', e => { db.toggleQattahPaid(t.id, e.currentTarget.dataset.togglePaid); render(); });
  on('[data-act="add-group"]', () => openExpense(t, 'group'));
  on('[data-del-group]', e => { db.removeGroupExpense(t.id, e.currentTarget.dataset.delGroup); render(); });

  // قطّات مشتركة (تحت القطة)
  on('[data-act="add-shared"]', () => openExpense(t, 'shared'));
  on('[data-del-shared]', e => { db.removeSharedExpense(t.id, e.currentTarget.dataset.delShared); render(); });
  on('[data-pay]', e => { copyText(JSON.parse(e.currentTarget.dataset.pay)); toast('تم نسخ تفاصيل التحويل ✓'); });

  // الأماكن + التجارب
  on('[data-act="add-place"]', () => openPlace(t));
  on('[data-visited]', e => { db.togglePlaceVisited(t.id, e.currentTarget.dataset.visited); render(); });
  on('[data-del-place]', e => { db.removePlace(t.id, e.currentTarget.dataset.delPlace); render(); });
  on('[data-add-review]', e => openReview(t, e.currentTarget.dataset.addReview));
  on('[data-del-review]', e => {
    const [pid, rid] = e.currentTarget.dataset.delReview.split('|');
    db.removeReview(t.id, pid, rid); render();
  });
}

function openModal({ title, body, footer }) {
  modalRoot.innerHTML = `
    <div class="modal-backdrop" data-close></div>

      <div class="modal-head"><h3>${title}</h3>
        <button class="icon-btn" data-close aria-label="إغلاق">${icons.close}</button></div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
  modalRoot.classList.add('open');
  modalRoot.setAttribute('aria-hidden', 'false');
  modalRoot.querySelectorAll('[data-close]').forEach(el => el.onclick = closeModal);
}
function closeModal() { modalRoot.classList.remove('open'); modalRoot.setAttribute('aria-hidden', 'true'); modalRoot.innerHTML = ''; }

  });

  });
  wireCountryPicker($('#f-homec'), $('#f-homec-list'), (c) => {

/* تحديد القطة */
function openPool(t) {
  const selected = new Set(t.pool.participantIds.length ? t.pool.participantIds : t.members.map(m => m.id));
  openModal({
    title: 'قطة الرحلة',
    body: `
      <div class="field"><label>إجمالي القطة <span class="hint">اختر العملة</span></label>
        <div class="amount-row">
          <input class="input" id="q-total" type="number" inputmode="decimal" min="0" step="0.01" value="${t.pool.total || ''}" placeholder="0" dir="ltr">
          <div class="seg cur-seg" id="q-cur">
            <button type="button" class="seg-opt sel" data-qcur="${t.homeCurrency}">${curLabel(t.homeCurrency)}<small>الديار</small></button>
            <button type="button" class="seg-opt" data-qcur="${t.destCurrency}">${curLabel(t.destCurrency)}<small>الوجهة</small></button>
          </div>
        </div></div>
      <div class="field"><label>على مين؟</label>
        <div class="seg" id="q-scope">
          <button type="button" class="seg-opt ${t.pool.participantIds.length === 0 || t._poolAll ? 'sel' : ''}" data-scope="all">على الكل<small>كل أعضاء القروب</small></button>
          <button type="button" class="seg-opt ${t.pool.participantIds.length && !t._poolAll ? 'sel' : ''}" data-scope="some">أشخاص معيّنين<small>تختارهم</small></button>
        </div></div>
      <div class="field" id="q-parts-field">
        <label>المشاركون</label>
        <div class="picker" id="q-parts">${t.members.map(m => `
          <button type="button" class="pick ${selected.has(m.id) ? 'sel' : ''}" data-part="${m.id}">
            <span class="dot" style="background:${m.color}">${esc(initials(m.name))}</span>${esc(m.name)}</button>`).join('')}</div></div>
      <div class="field"><label>القطة تشمل <span class="hint">اختياري</span></label>
        <textarea class="input" id="q-covers" placeholder="مثال: الفندق، المواصلات المشتركة، الأكل الجماعي">${esc(t.pool.covers)}</textarea></div>
      <div class="share-preview" id="q-preview"></div>`,
    footer: `<button class="btn btn-primary btn-block" id="q-save">${icons.check} حفظ القطة</button>`,
  });

  let scope = (t.pool.participantIds.length && !t._poolAll) ? 'some' : 'all';
  let qCur = t.homeCurrency;
  const partsField = $('#q-parts-field');
  const preview = $('#q-preview');

  const totalHome = () => {
    const v = parseFloat($('#q-total').value) || 0;
    return qCur === t.destCurrency && t.rate ? v / t.rate : v;
  };
  function currentParts() {
    if (scope === 'all') return t.members.map(m => m.id);
    return [...selected];
  }
  function refresh() {
    partsField.style.display = scope === 'some' ? 'block' : 'none';
    const total = totalHome();
    const n = currentParts().length;
    preview.innerHTML = n && total
      ? `الإجمالي ${money(total, t)} · نصيب الفرد: <b>${money(total / n, t)}</b> ≈ ${inDest(total / n, t)} <span class="muted-text">(${n} مشاركين)</span>`
      : '';
  }
  modalRoot.querySelectorAll('[data-qcur]').forEach(b => b.onclick = () => {
    modalRoot.querySelectorAll('[data-qcur]').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); qCur = b.dataset.qcur; refresh();
  });
  modalRoot.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => {
    modalRoot.querySelectorAll('[data-scope]').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); scope = b.dataset.scope; refresh();
  });
  modalRoot.querySelectorAll('[data-part]').forEach(b => b.onclick = () => {
    const id = b.dataset.part;
    if (selected.has(id)) { selected.delete(id); b.classList.remove('sel'); }
    else { selected.add(id); b.classList.add('sel'); }
    refresh();
  });
  $('#q-total').oninput = refresh;
  refresh();

  $('#q-save').onclick = () => {
    const total = totalHome();
    if (!(total > 0)) { toast('اكتب إجمالي القطة'); return; }
    const parts = currentParts();
    if (!parts.length) { toast('اختر المشاركين'); return; }
    db.setPool(t.id, { total, participantIds: parts, covers: $('#q-covers').value, poolAll: scope === 'all' });
    closeModal(); render(); toast('تم حفظ القطة ✓');
  };
}

  });

  const bdConv = () => { const v = parseFloat($('#bd').value) || 0; $('#bd-conv').innerHTML = v ? `≈ ${bCur === t.destCurrency ? money(bdHome(), t) : inDest(bdHome(), t)}` : ''; };

        <button type="button" class="pick ${m.id === state.paidBy ? 'sel' : ''}" data-payer="${m.id}">
          <span class="dot" style="background:${m.color}">${esc(initials(m.name))}</span>${esc(m.name)}</button>`).join('')}</div></div>
    <div class="field"><label>المشاركون <span class="hint">مين يتقاسمها (٢ أو أكثر)</span></label>
      <div class="picker" id="e-parts">${t.members.map(m => `
        <button type="button" class="pick ${state.parts.has(m.id) ? 'sel' : ''}" data-part="${m.id}">
          <span class="dot" style="background:${m.color}">${esc(initials(m.name))}</span>${esc(m.name)}</button>`).join('')}</div>
      <div class="share-preview" id="e-share" style="margin-top:10px"></div></div>` : '';

  openModal({
    title: titles[kind],
    body: `
      <div class="field"><label>الوصف</label>
        <input class="input" id="e-title" placeholder="مثال: ${kind === 'group' ? 'عشاء القروب' : kind === 'shared' ? 'تكسي مشترك' : 'قهوة'}" autocomplete="off"></div>
      <div class="field"><label>المبلغ <span class="hint">اختر العملة</span></label>
        <div class="amount-row">
          <input class="input" id="e-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" dir="ltr">
          <div class="seg cur-seg" id="e-cur">
            <button type="button" class="seg-opt sel" data-cur="${t.destCurrency}">${curLabel(t.destCurrency)}<small>الوجهة</small></button>
            <button type="button" class="seg-opt" data-cur="${t.homeCurrency}">${curLabel(t.homeCurrency)}<small>الديار</small></button>
          </div>
        </div>
        <div class="conv-preview" id="e-conv"></div></div>
      <div class="field"><label>الفئة</label>
        <div class="cat-grid" id="e-cats">${catList.map(cc => `
          <button type="button" class="cat-opt ${cc.key === 'food' ? 'sel' : ''}" data-cat="${cc.key}">${cc.icon}<span>${cc.label}</span></button>`).join('')}</div></div>
      ${sharedFields}`,
    footer: `<button class="btn btn-primary btn-block" id="e-save">${icons.check} حفظ</button>`,
  });

  const homeOf = (v) => state.enteredCur === t.destCurrency && t.rate ? v / t.rate : v;
  function refreshConv() {
    const v = parseFloat($('#e-amount').value) || 0;
    const other = state.enteredCur === t.destCurrency ? money(homeOf(v), t) : inDest(homeOf(v), t);
    $('#e-conv').innerHTML = v ? `≈ ${other}` : '';
    const share = $('#e-share');
    if (share) {
      const n = new Set([state.paidBy, ...state.parts]).size;
      share.innerHTML = v && n ? `نصيب كل شخص: <b>${money(homeOf(v) / n, t)}</b> ≈ ${inDest(homeOf(v) / n, t)} <span class="muted-text">(${n})</span>` : '';
    }
  }

  modalRoot.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    modalRoot.querySelectorAll('[data-cat]').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); state.category = b.dataset.cat;
  });
  modalRoot.querySelectorAll('[data-cur]').forEach(b => b.onclick = () => {
    modalRoot.querySelectorAll('[data-cur]').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); state.enteredCur = b.dataset.cur; refreshConv();
  });
  if (kind === 'shared') {
    modalRoot.querySelectorAll('[data-payer]').forEach(b => b.onclick = () => {
      modalRoot.querySelectorAll('[data-payer]').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
      state.paidBy = b.dataset.payer; refreshConv();
    });
    modalRoot.querySelectorAll('[data-part]').forEach(b => b.onclick = () => {
      const id = b.dataset.part;
      if (state.parts.has(id)) { state.parts.delete(id); b.classList.remove('sel'); }
      else { state.parts.add(id); b.classList.add('sel'); }
      refreshConv();
    });
  }
  $('#e-amount').oninput = refreshConv;
  $('#e-title').focus();

  $('#e-save').onclick = () => {
    const title = $('#e-title').value.trim();
    const amount = parseFloat($('#e-amount').value);
    if (!title) { toast('اكتب الوصف'); return; }
    if (!(amount > 0)) { toast('اكتب مبلغًا صحيحًا'); return; }
    const payload = { title, amount, category: state.category, enteredCur: state.enteredCur };
    if (kind === 'group') db.addGroupExpense(t.id, payload);
    else if (kind === 'personal') db.addPersonalExpense(t.id, t.currentMemberId, payload);
    else {
      const parts = new Set([state.paidBy, ...state.parts]);
      if (parts.size < 2) { toast('اختر شخصين على الأقل'); return; }
      db.addSharedExpense(t.id, { ...payload, paidBy: state.paidBy, participants: [...parts] });
    }
    closeModal(); render(); toast('تم الحفظ ✓');
  };
}

/* بحث الأماكن داخل التطبيق: قوقل Places (إن توفّر) ← OpenStreetMap ← قوقل ماب فقط لو ما لقى */
async function osmSearch(q) {
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ar&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error('osm');
  return res.json();
}

function openPlace(t) {
  openModal({
    title: 'إضافة مكان',
    body: `
      <div class="field"><label>ابحث عن المكان</label>
        <div class="ac-wrap">
          <span class="ac-icon">${icons.search}</span>
          <input class="input ac-input" id="p-name" placeholder="مثال: بحيرة أوزنجول" autocomplete="off">
          <div class="ac-list" id="p-ac"></div>
        </div>
        <span class="hint" id="p-hint">اكتب اسم المكان وتظهر النتائج هنا داخل التطبيق.</span></div>
      <div class="field"><label>ملاحظة <span class="hint">اختياري</span></label>
        <input class="input" id="p-note" placeholder="مثال: أفضل وقت الزيارة الصباح" autocomplete="off"></div>
      <a class="btn btn-ghost btn-block" id="p-open" target="_blank" rel="noopener" href="#" style="display:none">${icons.map} ما لقيته؟ ابحث في قوقل ماب</a>`,
    footer: `<button class="btn btn-primary btn-block" id="p-save">${icons.plus} إضافة</button>`,
  });

  const name = $('#p-name'), acList = $('#p-ac'), hint = $('#p-hint'), openBtn = $('#p-open');
  const picked = { placeId: '', mapUrl: '', lat: null, lng: null, address: '' };
  const clearPick = () => { picked.placeId = ''; picked.mapUrl = ''; picked.lat = picked.lng = null; picked.address = ''; };
  let gsvc = null, placesSvc = null, debounce, reqId = 0;

  // حمّل خرائط قوقل بصمت (إن توفّر مفتاح صالح)
  loadMaps().then(() => {
    gsvc = new google.maps.places.AutocompleteService();
    placesSvc = new google.maps.places.PlacesService(document.createElement('div'));
  }).catch(() => {});

  const showOpenBtn = (show) => {
    openBtn.style.display = show && name.value.trim() ? 'flex' : 'none';
    if (show) openBtn.href = mapsSearchUrl((name.value.trim() + ' ' + (t.destination || '')).trim());
  };
  const clearList = () => { acList.innerHTML = ''; acList.classList.remove('open'); };

  // نتائج قوقل
  function renderGoogle(preds) {
    acList.innerHTML = preds.slice(0, 6).map(pr => `
      <button type="button" class="ac-item" data-pid="${esc(pr.place_id)}" data-main="${esc(pr.structured_formatting?.main_text || pr.description)}">
        <span class="ac-pin">${icons.pin}</span>
        <span class="ac-txt"><b>${esc(pr.structured_formatting?.main_text || pr.description)}</b>
          <small>${esc(pr.structured_formatting?.secondary_text || '')}</small></span></button>`).join('');
    acList.classList.add('open'); showOpenBtn(false);
    acList.querySelectorAll('.ac-item').forEach(b => b.onclick = () => chooseGoogle(b.dataset.pid, b.dataset.main));
  }
  function chooseGoogle(placeId, mainText) {
    clearList(); name.value = mainText; showOpenBtn(false);
    if (!placesSvc) return;
    placesSvc.getDetails({ placeId, fields: ['name', 'geometry', 'formatted_address', 'url'] }, (d, status) => {
      if (status === google.maps.places.PlacesServiceStatus.OK && d) {
        picked.placeId = placeId;
        picked.address = d.formatted_address || '';
        picked.mapUrl = d.url || mapsPlaceUrl(d.name || mainText, placeId);
        picked.lat = d.geometry?.location?.lat?.() ?? null;
        picked.lng = d.geometry?.location?.lng?.() ?? null;
        if (d.name) name.value = d.name;
        hint.textContent = picked.address || 'تم اختيار المكان ✓';
      }
    });
  }

  // نتائج OpenStreetMap
  function renderOSM(results) {
    acList.innerHTML = results.slice(0, 6).map((r, i) => {
      const main = (r.name && r.name.trim()) || r.display_name.split('،')[0].split(',')[0];
      return `<button type="button" class="ac-item" data-i="${i}">
        <span class="ac-pin">${icons.pin}</span>
        <span class="ac-txt"><b>${esc(main)}</b><small>${esc(r.display_name)}</small></span></button>`;
    }).join('');
    acList.classList.add('open'); showOpenBtn(false);
    acList.querySelectorAll('.ac-item').forEach(b => b.onclick = () => {
      const r = results[+b.dataset.i];
      const main = (r.name && r.name.trim()) || r.display_name.split('،')[0].split(',')[0];
      clearList(); name.value = main;
      picked.lat = parseFloat(r.lat); picked.lng = parseFloat(r.lon);
      picked.address = r.display_name;
      picked.mapUrl = `https://www.google.com/maps/search/?api=1&query=${picked.lat},${picked.lng}`;
      hint.textContent = r.display_name;
    });
  }

  name.oninput = () => {
    clearPick();
    const q = name.value.trim();
    if (q.length < 2) { clearList(); showOpenBtn(false); return; }
    const my = ++reqId;
    clearTimeout(debounce);
    hint.textContent = 'جارٍ البحث…';
    debounce = setTimeout(() => {
      const query = q;
      const goOSM = () => osmSearch(query + ' ' + (t.destination || '')).then(rs => {
        if (my !== reqId) return;
        if (rs && rs.length) { renderOSM(rs); hint.textContent = 'اختر من النتائج.'; }
        else { clearList(); hint.textContent = 'ما فيه نتائج داخل التطبيق.'; showOpenBtn(true); }
      }).catch(() => { if (my !== reqId) return; clearList(); hint.textContent = 'تعذّر البحث.'; showOpenBtn(true); });

      if (gsvc) {
        gsvc.getPlacePredictions({ input: query }, (preds, status) => {
          if (my !== reqId) return;
          if (status === google.maps.places.PlacesServiceStatus.OK && preds?.length) { renderGoogle(preds); hint.textContent = 'اختر من النتائج.'; }
          else goOSM();
        });
      } else { goOSM(); }
    }, 300);
  };
  name.focus();

  $('#p-save').onclick = () => {
    const nm = name.value.trim();
    if (!nm) { toast('اكتب اسم المكان'); return; }
    db.addPlace(t.id, {
      name: nm, note: $('#p-note').value,
      mapUrl: picked.mapUrl, placeId: picked.placeId,
      lat: picked.lat, lng: picked.lng, address: picked.address,
    });
    closeModal(); render(); toast('تمت إضافة المكان ✓');
  };
}

/* تجربة عضو على مكان */
function openReview(t, placeId) {
  const place = t.places.find(p => p.id === placeId);
  if (!place) return;
  const me = db.memberById(t, t.currentMemberId) || db.memberById(t, t.amirId);
  const memberOpts = t.members.map(m => `<option value="${m.id}" ${m.id === me?.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
  let rating = 5;
  openModal({
    title: `تجربتك · ${esc(place.name)}`,
    body: `
      <div class="field"><label>باسم مين؟</label>
        <div class="select-wrap">${icons.chevron}<select class="select" id="rv-who">${memberOpts}</select></div></div>
      <div class="field"><label>تقييمك</label>
        <div class="star-pick" id="rv-stars">${[1, 2, 3, 4, 5].map(i => `<button type="button" class="star-btn ${i <= rating ? 'on' : ''}" data-star="${i}">${icons.star}</button>`).join('')}</div></div>
      <div class="field"><label>ملاحظتك / تجربتك <span class="hint">اختياري</span></label>
        <textarea class="input" id="rv-note" placeholder="مثال: المكان يستاهل الزيارة، روحوا الصباح وتجنّبوا الزحمة"></textarea></div>`,
    footer: `<button class="btn btn-primary btn-block" id="rv-save">${icons.check} نشر التجربة</button>`,
  });
  modalRoot.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
    rating = +b.dataset.star;
    modalRoot.querySelectorAll('[data-star]').forEach(x => x.classList.toggle('on', +x.dataset.star <= rating));
  });
  $('#rv-save').onclick = () => {
    db.addReview(t.id, placeId, { memberId: $('#rv-who').value, rating, note: $('#rv-note').value });
    closeModal(); render(); toast('تم نشر تجربتك ✓');
  };
}

/* =========================================================
   المزامنة السحابية
   ========================================================= */
const shareUrl = (id) => `${location.origin}${location.pathname}?t=${id}`;

function openShare(t) {
  if (!sync.syncEnabled()) {
    openModal({
      title: 'مشاركة ومزامنة',
      body: `<div class="pay-note">${icons.info}<span>لتفعيل مشاركة الرحلة مع القروب والمزامنة اللحظية، أضِف إعدادات <b>Supabase</b> (الرابط + المفتاح العام) من إعدادات الرحلة.</span></div>`,
      footer: `<button class="btn btn-primary btn-block" id="sh-go">${icons.gear} فتح الإعدادات</button>`,
    });
    $('#sh-go').onclick = () => { closeModal(); openSettings(t); };
    return;
  }
  const link = shareUrl(t.id);
  const waText = `انضم لرحلة ${t.destination} على بوردنق:\n${link}`;
  openModal({
    title: 'مشاركة ومزامنة',
    body: t.cloud
      ? `<div class="pay-note" style="background:var(--green-bg);color:var(--green)">${icons.cloud}<span>هذه الرحلة <b>مُزامَنة</b> — أي تعديل يظهر لكل من عنده الرابط لحظيًا.</span></div>
         <div class="field" style="margin-top:14px"><label>رابط الرحلة</label>
           <input class="input" id="sh-link" value="${esc(link)}" readonly dir="ltr"></div>`
      : `<div class="pay-note">${icons.info}<span>فعّل المزامنة لهذه الرحلة، ويصير لها رابط تشاركه مع القروب فيدخلونها ويتحدّثون لحظيًا.</span></div>`,
    footer: t.cloud
      ? `<div style="display:flex;gap:10px">
           <button class="btn btn-ghost btn-block" id="sh-copy">${icons.receipt} نسخ الرابط</button>
           <a class="btn btn-sand btn-block" href="${waLink('', waText)}" target="_blank" rel="noopener">${icons.send} واتساب</a></div>`
      : `<button class="btn btn-primary btn-block" id="sh-enable">${icons.cloud} تفعيل المزامنة والمشاركة</button>`,
  });
  if (t.cloud) {
    $('#sh-copy').onclick = () => { copyText(link); toast('تم نسخ الرابط ✓'); };
  } else {
    $('#sh-enable').onclick = async () => {
      db.updateTrip(t.id, { cloud: true });
      try {
        await sync.pushTrip(db.getTrip(t.id));
        ensureSubscriptions();
        toast('تم تفعيل المزامنة ✓');
        closeModal(); render(); openShare(db.getTrip(t.id));
      } catch (e) {
        db.updateTrip(t.id, { cloud: false });
        toast('تعذّرت المزامنة — تأكد من الإعدادات وجدول قاعدة البيانات');
        console.warn(e);
      }
    };
  }
}

let syncTimer;
const subs = {};
function scheduleSync() {
  if (!sync.syncEnabled()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    for (const t of db.getTrips()) {
      if (t.cloud) { try { await sync.pushTrip(t); } catch (e) { console.warn('push', e); } }
    }
  }, 700);
}
function ensureSubscriptions() {
  if (!sync.syncEnabled()) return;
  db.getTrips().forEach(t => {
    if (t.cloud && !subs[t.id]) {
      subs[t.id] = true;
      sync.subscribeTrip(t.id, (data) => {
        db.upsertTripFromCloud({ ...data, cloud: true });
        if (!R.tripId || R.tripId === t.id) render();
      }).then(unsub => { subs[t.id] = unsub; }).catch(() => { subs[t.id] = null; });
    }
  });
}
async function checkJoin() {
  const id = new URLSearchParams(location.search).get('t');
  if (!id) return;
  if (db.getTrip(id)) { go(id); return; }
  if (!sync.syncEnabled()) { toast('أضِف إعدادات Supabase لفتح الرحلة المشتركة'); return; }
  toast('جارٍ فتح الرحلة المشتركة…');
  try {
    const data = await sync.fetchTrip(id);
    if (data) { db.upsertTripFromCloud({ ...data, cloud: true }); ensureSubscriptions(); go(id); toast('انضممت للرحلة ✓'); }
    else toast('الرحلة غير موجودة');
  } catch (e) { toast('تعذّر فتح الرحلة'); console.warn(e); }
}

db.onChange(scheduleSync);

/* ---------------- إقلاع ---------------- */
render();
ensureSubscriptions();
checkJoin();

</script>
